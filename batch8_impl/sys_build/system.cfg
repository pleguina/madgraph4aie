# 50 dedicated PLIO pairs, NO packet switching.
# mm2s_<i>/s2mm_<i> (i=1..6) serve lanes 8*(i-1) .. 8*(i-1)+7;
# mm2s2_1/s2mm2_1 serve lanes 48 and 49.

[connectivity]
nk=mm2s:6
nk=s2mm:6
nk=mm2s2:1:mm2s2_1
nk=s2mm2:1:s2mm2_1

